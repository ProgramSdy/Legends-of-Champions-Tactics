schemaVersion: 1
definitionId: hero.rogue.comprehensiveness
introduction: |-
  A quick rogue who uses precision, poison, and evasive movement.
battleStyle: |-
  Prioritises vulnerable enemies while avoiding retaliation.
skills:
  - skillId: skill.rogue.sharp_blade
    introduction: |-
      A swift melee dagger strike that has 50% chance to cause bleeding.
  - skillId: skill.rogue.poisoned_dagger
    introduction: |-
      Rogue sneak to a ranged target and perform a poisoned dagger attack that has 85% chance to apply poison. Poison debuff max 2 stacks.
  - skillId: skill.rogue.shadow_evasion
    introduction: |-
      Enable Rogue to dodge all coming attack in the current round.
