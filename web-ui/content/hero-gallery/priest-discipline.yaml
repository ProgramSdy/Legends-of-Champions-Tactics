schemaVersion: 1
definitionId: hero.priest.discipline
introduction: |-
  A disciplined priest who turns holy conviction toward allies or enemies.
battleStyle: |-
  A rear line healer who turns holy damage on enemies into healing for allies.
skills:
  - skillId: skill.priest.penance
    introduction: |-
      Utilize holy energy to heal an ally or damages an enemy.
  - skillId: skill.priest.holy_word_redemption
    introduction: |-
      Places a restorative holy effect on one ally who receives healing whenever the Priest damages an enemy with one of her other skills.
  - skillId: skill.priest.holy_word_punishment
    introduction: |-
      Pressures 2 enemies with a continuous holy damage effect.
  - skillId: skill.priest.holy_concentration
    introduction: |-
      Priest concentrate on the guide from holy light. Holy Word Redemption will protect an extra hero if priest's hp is equal to or less than 75%.
