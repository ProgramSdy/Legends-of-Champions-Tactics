schemaVersion: 1
definitionId: hero.priest.comprehensiveness
introduction: |-
  A versatile priest who balances holy restoration with shadow pressure.
battleStyle: |-
  A rear line healer who masters both holy and shadow arts to support allies and weaken enemies.
skills:
  - skillId: skill.priest.holy_smite
    introduction: |-
      A direct holy light strike against one enemy.
  - skillId: skill.priest.shadow_word_pain
    introduction: |-
      Marks one enemy with a continuing shadow affliction.
  - skillId: skill.priest.binding_heal
    introduction: |-
      Restores an ally and also heals the caster.
