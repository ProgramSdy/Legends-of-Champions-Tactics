schemaVersion: 1
definitionId: hero.paladin.holy
introduction: |-
  A paladin who possesses a strong faith in the Holy Light.
battleStyle: |-
  A flexible front-line role focused on healing, cleansing, protection, and ranged holy pressure.
skills:
  - skillId: skill.paladin.purify_healing
    introduction: |-
      Restores one ally and applies a Purify Healing buff to the target. The buff lasts two rounds; on each effective round, it removes one bleeding, disease, or toxic debuff.
  - skillId: skill.paladin.holy_blast
    introduction: |-
      Her strong faith in the Holy Light allows her to launch a powerful holy missile at up to two enemies.
  - skillId: skill.paladin.shield_of_protection
    introduction: |-
      The Holy Light protects the Paladin from incoming attacks and instantly dispels harmful debuffs. This effect cannot be dispelled.
